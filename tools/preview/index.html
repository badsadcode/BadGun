<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BadGun Playground</title>
<meta name="description" content="Press a button, get a video game weapon. A procedural, already-painted 3D gun generator with ten worlds, from steampunk to cyberpunk. Download as .glb, ready to texture." />
<meta property="og:title" content="BadGun Playground" />
<meta property="og:description" content="Press a button, get a video game weapon. Ten worlds, already painted, downloadable as .glb and ready to texture." />
<meta property="og:image" content="https://raw.githubusercontent.com/badsadcode/BadGun/main/devlog/assets/001/banner.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎺</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #101114; --panel: #17191e; --panel2: #1e2128; --line: #2a2e37; --text: #e8e6e1; --dim: #8d919b;
    --accent: #ff6b3d; --accent2: #ffd23d; --ok: #5be0a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 'Space Grotesk', system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.5px; }
  h1 b { color: var(--accent); }
  .tag { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .surprise { width: 100%; font-size: 16px; padding: 11px; }
  .links { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .links a { color: var(--accent2); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin: 20px 0 8px; font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 3px; }
  select, input[type=text], input[type=number] { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a0d08; border-color: var(--accent); }
  button.icon { flex: 0 0 auto; width: 40px; }
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .types button { padding: 7px 4px; font-size: 13px; }
  .styles button.on, .types button.on { background: var(--accent); color: #1a0d08; border-color: var(--accent); }
  .param { display: grid; grid-template-columns: 78px 1fr 38px 22px; gap: 6px; align-items: center; margin: 4px 0; font-size: 12px; }
  .param span { color: var(--dim); }
  .param output { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right; }
  .param.auto output { color: var(--dim); }
  .param .lock { cursor: pointer; text-align: center; opacity: .5; }
  .param:not(.auto) .lock { opacity: 1; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .mats { display: grid; gap: 4px; }
  .clips { display: flex; flex-wrap: wrap; gap: 6px; }
  .clips button.on { background: var(--accent, #ff6b3d); color: #111; }
  .animopts { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--dim); }
  .animopts label { display: flex; gap: 6px; align-items: center; margin: 0; }
  .event { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font: 700 22px 'JetBrains Mono', monospace; color: #ffd23d; letter-spacing: 2px; pointer-events: none; opacity: 0; transition: opacity .35s; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .event.show { opacity: 1; transition: none; }
  body.shot .event { display: none; }
  .mat { display: grid; grid-template-columns: 28px 1fr 26px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  .mat:hover, .mat.iso { background: var(--panel2); }
  .mat input[type=color] { width: 28px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
  .mat .name { font-size: 12px; }
  .mat .name small { display: block; color: var(--dim); font-size: 11px; }
  .mat .eye { text-align: center; opacity: .5; font-size: 12px; }
  .mat.iso .eye { opacity: 1; }
  main { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  aside { min-width: 0; }
  canvas { display: block; touch-action: none; }
  .hud { position: absolute; left: 16px; bottom: 14px; font: 12px 'JetBrains Mono', monospace; color: var(--dim); pointer-events: none; }
  .hud b { color: var(--text); font-weight: 600; }
  .toolbar { position: absolute; right: 14px; top: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 28px); }
  .toolbar button.on { background: var(--accent, #ff6b3d); color: #111; }
  .uvpanel { position: absolute; right: 14px; top: 58px; width: min(300px, 42vw); background: rgba(16,18,22,.92); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px; display: none; }
  .uvpanel.open { display: block; }
  .uvpanel canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 6px; image-rendering: auto; }
  .uvpanel .cap { font: 11px 'JetBrains Mono', monospace; color: var(--dim); margin-top: 6px; line-height: 1.45; }
  body.shot .uvpanel.open { display: block; top: 14px; }
  .parts { font: 11px 'JetBrains Mono', monospace; color: var(--dim); }
  .parts div { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .parts b { color: var(--text); font-weight: 600; }
  .err { color: #ff6b6b; font-size: 12px; }
  body.shot { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  body.shot aside, body.shot .hud, body.shot .toolbar { display: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 48dvh minmax(0, 1fr); }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    .hud { left: 12px; right: 12px; bottom: 8px; font-size: 10px; }
    .toolbar { right: 10px; top: 10px; }
    .toolbar button { padding: 6px 8px; font-size: 12px; }
    .uvpanel { width: 36vw; top: 52px; right: 10px; padding: 6px; }
    .uvpanel .cap { font-size: 9px; }
    .links span { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<aside>
  <h1>Bad<b>Gun</b></h1>
  <div class="tag">Press a button, get a video game weapon.</div>
  <button class="primary surprise" id="surprise">🎲 Surprise me</button>
  <div class="links"><a href="https://github.com/badsadcode/BadGun" target="_blank" rel="noopener">GitHub</a> · <a href="https://badsadcode.github.io/BadGun/devlog/" target="_blank" rel="noopener">Devlog</a><span> · drag to spin, scroll to zoom</span></div>

  <h2>Weapon</h2>
  <div class="types" id="types"></div>

  <h2>Style</h2>
  <div class="styles" id="styles"></div>

  <h2>Seed</h2>
  <div class="row">
    <input type="text" id="seed" value="1" />
    <button class="icon" id="prev" title="Previous seed">◀</button>
    <button class="icon" id="next" title="Next seed">▶</button>
    <button class="icon" id="dice" title="Random seed">🎲</button>
  </div>

  <h2>Art direction <small style="text-transform:none;letter-spacing:0">(🔒 = pinned, otherwise seed decides)</small></h2>
  <div id="params"></div>

  <h2>Look</h2>
  <label>Palette</label><select id="palette"></select>
  <label>Optic</label><select id="optic"></select>

  <h2 id="animHead">Animation <small style="text-transform:none;letter-spacing:0">(click to play)</small></h2>
  <div class="clips" id="clips"></div>
  <div class="animopts" id="animopts"><label><input type="checkbox" id="slowmo" checked /> Slow motion</label><label><input type="checkbox" id="loop" /> Loop</label></div>

  <h2>Parts</h2>
  <div id="partsel"></div>

  <h2>Materials <small style="text-transform:none;letter-spacing:0">(click to isolate)</small></h2>
  <div class="mats" id="mats"></div>
  <div class="row" style="margin-top:8px"><button id="resetColors">Reset colors</button></div>

  <h2>Export</h2>
  <div class="row"><button class="primary" id="exportGlb">⬇ .glb</button><button id="saveRecipe">Save recipe</button></div>
  <div class="row" style="margin-top:6px"><button id="exportTextured" title="The .glb with the colors baked into a texture, ready to paint">⬇ .glb + texture</button><button id="exportMaps" title="Base color, ID map and UV template as PNG files">⬇ Texture maps</button></div>
  <label style="margin-top:8px">UV set 0 <small>(the one most tools paint on)</small></label>
  <select id="uvFirst"><option value="tiling">Tiling (repeating textures)</option><option value="atlas">Atlas (unique, paintable)</option></select>
  <div class="row" style="margin-top:6px"><button id="loadRecipe">Load recipe</button><button id="copyLink">Copy link</button></div>
  <input type="file" id="file" accept=".json" hidden />
  <div class="err" id="err"></div>

  <h2>Assembly</h2>
  <div class="parts" id="assembly"></div>
</aside>
<main id="view">
  <div class="toolbar">
    <button id="explode" title="Pull parts apart">Explode</button>
    <button id="sockets" title="Show sockets">Sockets</button>
    <button id="checker" title="Show the paintable texture layout as a checkerboard">Checker</button>
    <button id="uvmap" title="Show the UV map (texture layout)">UV map</button>
    <button id="frame" title="Reset camera">Frame</button>
  </div>
  <div class="uvpanel" id="uvpanel"><canvas id="uvcanvas" width="512" height="512"></canvas><div class="cap" id="uvcap"></div></div>
  <div class="hud" id="hud"></div>
  <div class="event" id="event"></div>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BadGun from '../../dist/index.js';

const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const shot = qs.has('shot');
if (shot) document.body.classList.add('shot');

// ---------------------------------------------------------------- state
let recipe = { archetype: 'rifle', style: 'modern', seed: 1, params: {}, optic: 'auto', parts: {}, palette: {} };
const fromHash = () => { try { return JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch { return null; } };
const hashRecipe = fromHash() ?? (qs.get('recipe') ? JSON.parse(qs.get('recipe')) : null);
if (hashRecipe) recipe = { ...recipe, ...hashRecipe };

// ---------------------------------------------------------------- three
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: shot });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const bg = qs.get('bg');
scene.background = bg === 'none' ? null : new THREE.Color(bg ? '#' + bg : '#15171b');
if (bg === 'none') for (const el of [document.documentElement, document.body]) el.style.background = 'transparent';
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-1.2, 2.4, 0.9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.1, far: 6 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 1.1);
rim.position.set(1.5, 0.9, -1.4);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.28 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

let current = null, currentWeapon = null, exploded = false, showSockets = false;
const loader = new GLTFLoader();

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  ground.position.y = box.min.y - 0.002;
  // Fit the gun's length to the frame width (and its height to the frame height).
  const tanHalf = Math.tan((camera.fov * Math.PI) / 360);
  const view = qs.get('view') ?? 'three-quarter';
  const margin = view === 'side' ? 1.12 : 1.02;
  const dist = Math.max((size.z * margin) / (2 * tanHalf * camera.aspect), (size.y * 1.3) / (2 * tanHalf)) + size.x / 2;
  const dir = view === 'side' ? new THREE.Vector3(-1, 0.06, 0) : new THREE.Vector3(-1, 0.3, 0.5);
  camera.position.copy(center).add(dir.normalize().multiplyScalar(dist));
  controls.target.copy(center);
  controls.update();
}

// ---------------------------------------------------------------- generate
async function regenerate(keepCamera = true) {
  $('err').textContent = '';
  try {
    // Faction mode shows a whole matching arsenal; otherwise one weapon.
    let weapon, glb;
    if (recipe.archetype === 'faction') {
      currentFaction = BadGun.generateFaction(factionRecipe());
      currentKit = null;
      weapon = currentFaction.members[0].weapon;
      glb = BadGun.factionToGLB(currentFaction);
    } else if (recipe.archetype === 'kit') {
      // Attachment kit: every attachment that suits the world, side by side.
      currentFaction = null;
      currentKit = BadGun.generateAttachmentKit(factionRecipe());
      weapon = currentKit.items[0];
      glb = BadGun.kitToGLB(currentKit);
    } else {
      currentFaction = currentKit = null;
      weapon = BadGun.generate(clean(recipe));
      glb = BadGun.toGLB(weapon);
    }
    currentWeapon = weapon;
    const gltf = await loader.parseAsync(glb.buffer.slice(glb.byteOffset, glb.byteOffset + glb.byteLength), '');
    if (current) scene.remove(current);
    current = gltf.scene;
    setupAnimations(gltf);
    current.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    current.traverse((o) => { if (o.name.startsWith('SOCKET_')) o.add(socketGizmo()); });
    scene.add(current);
    if (!keepCamera || !frame.done) { frame(current); frame.done = true; }
    applyPose();
    exploded = false;
    applySocketVisibility();
    applyChecker();
    drawUvMap();
    refreshUI(weapon);
    if (!shot) history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(clean(recipe))));
    document.title = currentFaction ? `BadGun · ${currentFaction.name}` : currentKit ? `BadGun · ${recipe.style} attachment kit` : `BadGun · ${weapon.recipe.style} #${weapon.recipe.seed}`;
    if (shot && qs.has('explode') && !exploded) { $('explode').click(); frame(current); }
    window.__ready = true;
  } catch (e) {
    console.error(e);
    $('err').textContent = e.message;
  }
}

let currentFaction = null, currentKit = null;

/** The faction recipe for faction mode (shared params minus length). */
function factionRecipe() {
  const f = { style: recipe.style, seed: recipe.seed };
  const params = { ...(recipe.params ?? {}) };
  delete params.length;
  if (Object.keys(params).length) f.params = params;
  if (recipe.paletteVariant !== undefined) f.paletteVariant = recipe.paletteVariant;
  return f;
}

function clean(r) {
  const out = { archetype: r.archetype, style: r.style, seed: r.seed };
  if (Object.keys(r.params ?? {}).length) out.params = r.params;
  if (r.optic && r.optic !== 'auto') out.optic = r.optic;
  if (r.paletteVariant !== undefined) out.paletteVariant = r.paletteVariant;
  if (Object.keys(r.parts ?? {}).length) out.parts = r.parts;
  if (Object.keys(r.palette ?? {}).length) out.palette = r.palette;
  return out;
}

function socketGizmo() {
  const g = new THREE.Group();
  g.name = '__gizmo';
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.006, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffd23d, depthTest: false })));
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.05, 0xffd23d, 0.015, 0.008);
  g.add(arrow);
  g.traverse((o) => { o.renderOrder = 999; if (o.material) o.material.depthTest = false; });
  return g;
}
function applySocketVisibility() { current?.traverse((o) => { if (o.name === '__gizmo') o.visible = showSockets; }); }

// ---------------------------------------------------------------- recolor (no regeneration!)
function materialsByName() {
  const map = new Map();
  current?.traverse((o) => { if (o.isMesh) for (const m of [o.material].flat()) map.set(m.name, m); });
  return map;
}
function recolor(slot, hex) {
  recipe.palette = { ...recipe.palette, [slot]: hex };
  const m = materialsByName().get('MAT_' + slot);
  if (m) {
    m.userData.baseColor = new THREE.Color(hex).getHex();
    if (!showChecker) m.color.set(hex); // three handles sRGB -> linear
  }
  history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(clean(recipe))));
}
let isolated = null;
function isolate(slot) {
  isolated = isolated === slot ? null : slot;
  const mats = materialsByName();
  for (const [name, m] of mats) {
    m.userData.orig ??= { opacity: m.opacity, transparent: m.transparent };
    const dim = isolated && name !== 'MAT_' + isolated;
    m.transparent = dim ? true : m.userData.orig.transparent;
    m.opacity = dim ? 0.08 : m.userData.orig.opacity;
    m.depthWrite = !dim;
    m.needsUpdate = true;
  }
  document.querySelectorAll('.mat').forEach((el) => el.classList.toggle('iso', el.dataset.slot === isolated));
}

// ---------------------------------------------------------------- UI
const PARAM_LABELS = { length: 'Length', bulk: 'Bulk', ornament: 'Ornament', detail: 'Detail', smoothness: 'Smooth', wear: 'Wear' };

const TYPE_ICONS = { rifle: 'Rifle', smg: 'SMG', shotgun: 'Shotgun', sniper: 'Sniper', lmg: 'LMG', pistol: 'Pistol', revolver: 'Revolver', crossbow: 'Crossbow', bow: 'Bow', launcher: 'Launcher' };

function buildStaticUI() {
  $('types').innerHTML = '';
  for (const a of Object.values(BadGun.ARCHETYPES)) {
    const b = document.createElement('button');
    b.textContent = TYPE_ICONS[a.id] ?? a.name;
    b.title = a.description;
    b.dataset.arch = a.id;
    b.onclick = () => { recipe.archetype = a.id; recipe.parts = {}; recipe.optic = 'auto'; isolated = null; regenerate(false); };
    $('types').append(b);
  }
  const fb = document.createElement('button');
  fb.textContent = '⚑ Faction';
  fb.title = 'A whole matching arsenal: shared colors, doctrine, proportions and insignia';
  fb.dataset.arch = 'faction';
  fb.onclick = () => { recipe.archetype = 'faction'; recipe.parts = {}; recipe.optic = 'auto'; isolated = null; regenerate(false); };
  $('types').append(fb);
  const kb = document.createElement('button');
  kb.textContent = '🔧 Kit';
  kb.title = 'Attachment kit: every scope, muzzle device, grip and light that suits this world, as separate pieces';
  kb.dataset.arch = 'kit';
  kb.onclick = () => { recipe.archetype = 'kit'; recipe.parts = {}; recipe.optic = 'auto'; isolated = null; regenerate(false); };
  $('types').append(kb);
  $('styles').innerHTML = '';
  for (const s of Object.values(BadGun.STYLES)) {
    const b = document.createElement('button');
    b.textContent = s.name;
    b.title = s.description;
    b.dataset.style = s.id;
    b.onclick = () => { recipe.style = s.id; recipe.parts = {}; recipe.palette = {}; delete recipe.paletteVariant; recipe.optic = 'auto'; isolated = null; regenerate(false); };
    $('styles').append(b);
  }
  $('params').innerHTML = '';
  for (const key of BadGun.PARAM_KEYS) {
    const row = document.createElement('div');
    row.className = 'param';
    row.dataset.key = key;
    row.innerHTML = `<span>${PARAM_LABELS[key]}</span><input type="range" min="0" max="1" step="0.01" /><output></output><span class="lock" title="Pin / unpin">🔒</span>`;
    const input = row.querySelector('input');
    input.oninput = () => { recipe.params = { ...recipe.params, [key]: Number(input.value) }; regenerate(); };
    row.querySelector('.lock').onclick = () => {
      const p = { ...recipe.params };
      if (key in p) delete p[key]; else p[key] = Number(input.value);
      recipe.params = p;
      regenerate();
    };
    $('params').append(row);
  }
  $('optic').onchange = () => { recipe.optic = $('optic').value; regenerate(); };
  $('palette').onchange = () => {
    const v = $('palette').value;
    if (v === 'auto') delete recipe.paletteVariant; else recipe.paletteVariant = Number(v);
    recipe.palette = {};
    regenerate();
  };
}

/** Part and optic menus depend on the weapon type. */
function buildArchetypeUI() {
  const arch = BadGun.getArchetype(recipe.archetype);
  $('partsel').dataset.arch = arch.id;
  $('optic').innerHTML = ['auto', ...arch.optics].map((o) => `<option>${o}</option>`).join('');
  $('partsel').innerHTML = '';
  for (const kind of Object.keys(arch.parts)) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<label>${kind}</label><select data-kind="${kind}"></select>`;
    const sel = wrap.querySelector('select');
    sel.innerHTML = ['auto', ...Object.keys(arch.parts[kind])].map((v) => `<option>${v}</option>`).join('');
    sel.onchange = () => {
      const parts = { ...recipe.parts };
      if (sel.value === 'auto') delete parts[kind]; else parts[kind] = sel.value;
      recipe.parts = parts;
      regenerate();
    };
    $('partsel').append(wrap);
  }
}

function refreshUI(weapon) {
  const style = BadGun.getStyle(recipe.style);
  document.querySelectorAll('#styles button').forEach((b) => b.classList.toggle('on', b.dataset.style === recipe.style));
  document.querySelectorAll('#types button').forEach((b) => b.classList.toggle('on', b.dataset.arch === recipe.archetype));
  const factionMode = recipe.archetype === 'faction' || recipe.archetype === 'kit';
  for (const id of ['partsel', 'optic']) $(id).style.display = factionMode ? 'none' : '';
  if (!factionMode && $('partsel').dataset.arch !== recipe.archetype) buildArchetypeUI();
  $('seed').value = recipe.seed;
  for (const row of document.querySelectorAll('.param')) {
    const key = row.dataset.key;
    const pinned = recipe.params && key in recipe.params;
    row.classList.toggle('auto', !pinned);
    row.querySelector('input').value = weapon.params[key];
    row.querySelector('output').textContent = weapon.params[key].toFixed(2);
  }
  $('palette').innerHTML = `<option value="auto">auto (${weapon.paletteName})</option>` + style.palettes.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
  $('palette').value = recipe.paletteVariant ?? 'auto';
  $('optic').value = recipe.optic ?? 'auto';
  for (const sel of document.querySelectorAll('#partsel select')) sel.value = recipe.parts?.[sel.dataset.kind] ?? 'auto';

  const manifest = BadGun.buildManifest(weapon);
  $('mats').innerHTML = '';
  for (const m of manifest.materials) {
    const el = document.createElement('div');
    el.className = 'mat';
    el.dataset.slot = m.slot;
    el.innerHTML = `<input type="color" value="${m.def.color}" /><div class="name">${m.name}<small>${m.def.label ?? ''}</small></div><span class="eye">👁</span>`;
    const picker = el.querySelector('input');
    picker.onclick = (e) => e.stopPropagation();
    picker.oninput = () => recolor(m.slot, picker.value);
    el.onclick = () => isolate(m.slot);
    $('mats').append(el);
  }
  if (isolated) { const s = isolated; isolated = null; isolate(s); }

  $('assembly').innerHTML = manifest.components
    .map((c) => `<div><b>${c.name}</b><span>${c.variant}${c.motion ? ' ⟲' : ''} · ${c.triangles}</span></div>`).join('') +
    manifest.sockets.map((s) => `<div><span>◆ ${s.name}</span><span>${s.parent}</span></div>`).join('');
  const st = manifest.stats;
  if (currentKit) {
    const tris = currentKit.items.reduce((n, w) => n + BadGun.buildManifest(w).stats.triangles, 0);
    const count = (t) => currentKit.items.filter((w) => w.attachment.type === t).length;
    $('hud').innerHTML = `🔧 <b>${BadGun.getStyle(recipe.style).name} attachment kit</b> · ${currentKit.items.length} attachments: ${count('optic')} optics, ${count('muzzle')} muzzle devices, ${count('underbarrel')} underbarrel, ${count('side')} side rail<br>palette <b>${weapon.paletteName}</b> · ${tris.toLocaleString()} tris in total`;
  } else if (currentFaction) {
    const f = currentFaction;
    const tris = f.members.reduce((n, m) => n + BadGun.buildManifest(m.weapon).stats.triangles, 0);
    $('hud').innerHTML = `<b style="color:${f.color}">⚑</b> <b>${f.name}</b> · ${f.members.length} weapons · ${f.livery} livery · ${f.insignia.shape} insignia<br>palette <b>${weapon.paletteName}</b> · ${tris.toLocaleString()} tris in total · doctrine: ${Object.entries(f.doctrine.longgun ?? {}).filter(([k]) => ['config', 'receiver', 'stock'].includes(k)).map(([k, v]) => `${k} ${v}`).join(', ')}`;
  } else {
    $('hud').innerHTML = `<b>${manifest.name}</b> · palette <b>${weapon.paletteName}</b><br>${st.triangles.toLocaleString()} tris · ${st.vertices.toLocaleString()} verts · ${st.materials} materials · ${st.primitives} draw calls · ${manifest.bounds.size[2].toFixed(2)} m long`;
  }
}

function setSeed(s) { recipe.seed = /^-?\d+$/.test(String(s)) ? Number(s) : s; regenerate(false); }
$('seed').onchange = () => setSeed($('seed').value);
$('prev').onclick = () => setSeed(typeof recipe.seed === 'number' ? recipe.seed - 1 : 1);
$('next').onclick = () => setSeed(typeof recipe.seed === 'number' ? recipe.seed + 1 : 1);
$('dice').onclick = () => setSeed(Math.floor(Math.random() * 100000));
$('surprise').onclick = () => {
  const styles = Object.keys(BadGun.STYLES);
  const types = Object.keys(BadGun.ARCHETYPES);
  recipe = { archetype: types[Math.floor(Math.random() * types.length)], style: styles[Math.floor(Math.random() * styles.length)], seed: Math.floor(Math.random() * 100000), params: {}, optic: 'auto', parts: {}, palette: {} };
  isolated = null;
  regenerate(false);
};
$('resetColors').onclick = () => { recipe.palette = {}; regenerate(); };
$('frame').onclick = () => current && frame(current);
$('sockets').onclick = () => { showSockets = !showSockets; applySocketVisibility(); };

// ---------------------------------------------------------------- texturing views
// Checker: a grid texture on the atlas UV set (TEXCOORD_1, or 0 when atlas comes first).
let showChecker = shot && qs.has('checker'), showUv = shot && qs.has('uvmap');
let checkerTex = null;
function makeChecker() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  const n = 32, cell = 1024 / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    g.fillStyle = (x + y) % 2 ? '#f2f2f2' : '#3a3d44';
    g.fillRect(x * cell, y * cell, cell, cell);
  }
  // Colored corner marks show orientation inside each 4x4 block.
  g.fillStyle = '#ff6b3d';
  for (let y = 0; y < n; y += 4) for (let x = 0; x < n; x += 4) g.fillRect(x * cell + 3, y * cell + 3, cell * 0.35, cell * 0.35);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function applyChecker() {
  $('checker').classList.toggle('on', showChecker);
  checkerTex ??= makeChecker();
  checkerTex.channel = $('uvFirst').value === 'atlas' ? 0 : 1;
  current?.traverse((o) => {
    if (!o.isMesh || o.name === '__gizmo') return;
    for (const m of [o.material].flat()) {
      if (!m.isMeshStandardMaterial) continue;
      if (m.userData.baseColor === undefined) m.userData.baseColor = m.color.getHex();
      m.map = showChecker ? checkerTex : null;
      if (showChecker) m.color.setHex(0xffffff); else m.color.setHex(m.userData.baseColor);
      m.needsUpdate = true;
    }
  });
}
function drawUvMap() {
  $('uvmap').classList.toggle('on', showUv);
  $('uvpanel').classList.toggle('open', showUv);
  if (!showUv || !currentWeapon) return;
  const size = 512;
  const img = BadGun.bakeTexture(currentWeapon, 'layout', { size });
  const ctx = $('uvcanvas').getContext('2d');
  ctx.putImageData(new ImageData(new Uint8ClampedArray(img.data.buffer, img.data.byteOffset, img.data.byteLength), size, size), 0, 0);
  const a = BadGun.weaponAtlas(currentWeapon);
  $('uvcap').innerHTML = `${currentFaction ? 'first member · ' : currentKit ? 'first attachment · ' : ''}<b>${a.charts}</b> islands · ${Math.round(a.coverage * 100)}% used<br>${Math.round(a.uvPerMeter * 1024 / 100)} px/cm @1K · ${Math.round(a.uvPerMeter * 2048 / 100)} @2K`;
}
$('checker').onclick = () => { showChecker = !showChecker; applyChecker(); };

// ---------------------------------------------------------------- animation clips
let mixer = null, clips = [], clipInfo = new Map(), activeAction = null, activeClip = null, eventTimer = 0;
function setupAnimations(gltf) {
  mixer = gltf.animations.length ? new THREE.AnimationMixer(gltf.scene) : null;
  clips = gltf.animations;
  clipInfo = new Map(currentWeapon && !currentFaction && !currentKit ? BadGun.weaponClips(currentWeapon).map((c) => [c.name, c]) : []);
  activeAction = activeClip = null;
  const box = $('clips');
  box.innerHTML = '';
  for (const clip of clips) {
    const b = document.createElement('button');
    b.textContent = '▶ ' + clip.name;
    b.title = clipInfo.get(clip.name)?.description ?? '';
    b.onclick = () => playClip(clip.name);
    box.appendChild(b);
  }
  for (const id of ['animHead', 'clips', 'animopts']) $(id).style.display = clips.length ? '' : 'none';
}
/** Screenshot mode: freeze a pose, e.g. ?pose=Reload@0.5 (after framing the rest pose). */
function applyPose() {
  const pose = shot && qs.get('pose');
  if (pose && mixer) {
    const [name, t] = pose.split('@');
    const clip = clips.find((c) => c.name === name);
    if (clip) {
      const a = mixer.clipAction(clip);
      a.setLoop(THREE.LoopOnce, 1);
      a.clampWhenFinished = true;
      a.play();
      mixer.setTime(Number(t) || 0);
    }
  }
}
function playClip(name) {
  const clip = clips.find((c) => c.name === name);
  if (!clip || !mixer) return;
  mixer.stopAllAction();
  activeClip = clip;
  activeAction = mixer.clipAction(clip);
  activeAction.setLoop($('loop').checked ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  activeAction.clampWhenFinished = true;
  activeAction.timeScale = $('slowmo').checked ? 0.25 : 1;
  activeAction.reset().play();
  document.querySelectorAll('#clips button').forEach((b) => b.classList.toggle('on', b.textContent === '▶ ' + name));
}
/** Flash event names (shot, magOut...) as the playhead passes them. */
function flashEvents(before, after) {
  const events = clipInfo.get(activeClip?.name)?.events;
  if (!events) return;
  for (const [name, t] of Object.entries(events)) {
    const wrapped = after < before; // looped around
    if ((!wrapped && before < t && t <= after) || (wrapped && (t > before || t <= after))) {
      const el = $('event');
      el.textContent = name === 'shot' ? '💥 shot' : '♪ ' + name;
      el.classList.add('show');
      clearTimeout(eventTimer);
      eventTimer = setTimeout(() => el.classList.remove('show'), 350);
    }
  }
}
$('slowmo').onchange = () => { if (activeAction) activeAction.timeScale = $('slowmo').checked ? 0.25 : 1; };
$('loop').onchange = () => { if (activeClip) playClip(activeClip.name); };
$('uvmap').onclick = () => { showUv = !showUv; drawUvMap(); };
$('uvFirst').onchange = () => applyChecker();
$('explode').onclick = () => {
  if (!current) return;
  exploded = !exploded;
  const offsets = { Stock: [0, 0, -0.08], Magazine: [0, -0.1, 0.02], Grip: [0, -0.05, -0.02], Optic: [0, 0.07, 0], Handguard: [0, 0, 0.06], Barrel: [0, 0, 0.12], Muzzle: [0, 0, 0.05], Trigger: [0, -0.03, 0], ChargingHandle: [0, 0.03, -0.04], Hammer: [0, 0.04, -0.02], FrontSight: [0, 0.04, 0], Slide: [0, 0.04, -0.03], Cylinder: [0.06, 0, 0], Prod: [0, 0, 0.1], String: [0, 0.04, 0], Bolt: [0, 0.07, 0.05], Bipod: [0, -0.05, 0.04], BoltHandle: [-0.05, 0, 0], CarryHandle: [0, 0.05, 0], Stirrup: [0, 0, 0.06], Crank: [-0.06, 0, 0], LimbTop: [0, 0.08, 0], LimbBottom: [0, -0.08, 0], Arrow: [0.06, 0, 0.1] };
  current.traverse((o) => {
    const off = offsets[o.name];
    if (!off) return;
    o.userData.home ??= o.position.clone();
    o.position.copy(o.userData.home);
    if (exploded) o.position.add(new THREE.Vector3(...off));
  });
};
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('exportGlb').onclick = () => {
  if (currentFaction) return download(currentFaction.name.replace(/[^A-Za-z0-9]+/g, '_') + '.glb', BadGun.factionToGLB(currentFaction, { uv: $('uvFirst').value }), 'model/gltf-binary');
  if (currentKit) return download(`BadGun_kit_${recipe.style}_${recipe.seed}.glb`, BadGun.kitToGLB(currentKit), 'model/gltf-binary');
  const w = BadGun.generate(clean(recipe));
  download(BadGun.weaponName(w) + '.glb', BadGun.toGLB(w, { uv: $('uvFirst').value }), 'model/gltf-binary');
};
$('exportTextured').onclick = () => {
  if (currentFaction || currentKit) return ($('err').textContent = 'Textured export works for single weapons (each has its own texture layout).');
  const w = BadGun.generate(clean(recipe));
  download(BadGun.weaponName(w) + '_textured.glb', BadGun.toGLB(w, { uv: $('uvFirst').value, texture: 1024 }), 'model/gltf-binary');
};
$('exportMaps').onclick = async () => {
  if (currentFaction || currentKit) return ($('err').textContent = 'Texture maps work for single weapons (each has its own texture layout).');
  const w = BadGun.generate(clean(recipe));
  const name = BadGun.weaponName(w);
  for (const [mode, suffix] of [['basecolor', 'BaseColor'], ['id', 'ID'], ['layout', 'UVTemplate']]) {
    const img = BadGun.bakeTexture(w, mode, { size: 1024 });
    download(`${name}_${suffix}.png`, BadGun.encodePNG(img.data, img.width, img.height), 'image/png');
    await new Promise((r) => setTimeout(r, 300)); // browsers dislike a burst of downloads
  }
};
$('saveRecipe').onclick = () => currentKit
  ? download(`BadGun_kit_${recipe.style}_${recipe.seed}.json`, JSON.stringify({ style: recipe.style, seed: recipe.seed, items: currentKit.items.map((w) => w.attachment) }, null, 2), 'application/json')
  : currentFaction
  ? download(currentFaction.name.replace(/[^A-Za-z0-9]+/g, '_') + '.faction.json', JSON.stringify(BadGun.factionSummary(currentFaction), null, 2), 'application/json')
  : download(BadGun.weaponName(currentWeapon) + '.recipe.json', JSON.stringify(clean(recipe), null, 2), 'application/json');
$('loadRecipe').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  recipe = { archetype: 'rifle', params: {}, parts: {}, palette: {}, optic: 'auto', ...JSON.parse(await f.text()) };
  regenerate(false);
};
$('copyLink').onclick = () => navigator.clipboard?.writeText(location.href);

buildStaticUI();
resize();
regenerate(false);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && !shot) {
    const before = activeAction?.time ?? 0;
    mixer.update(dt);
    flashEvents(before, activeAction?.time ?? 0);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
